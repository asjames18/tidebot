services:
  tidebot:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8787"
      DEV_LOGIN: "0"
      # The host port above is loopback-only, so the only peers that reach the app are local
      # containers or a host reverse proxy, which appears as the Docker bridge gateway. Trust
      # private bridge ranges for X-Forwarded-For; override via TRUST_PROXY in .env.
      TRUST_PROXY: "${TRUST_PROXY:-172.16.0.0/12}"
      DB_PATH: /data/grokbot.db
      ENV_PATH: /data/studio.env
      WEB_DIST_DIR: /app/web/dist
      TIDEBOT_DESKTOP_SIGNUP_ORIGIN: ""
    volumes:
      - tidebot-data:/data

volumes:
  tidebot-data:
