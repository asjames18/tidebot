name: CI

on:
  push:
    branches: [main, 'codex/platform-qa-release*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  self-hosted:
    name: Self-hosted Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the self-hosted stack
        run: |
          cat > .env <<'ENV'
          STUDIO_EMAIL=compose-fixture@example.test
          STUDIO_PASSWORD=compose-only-test-password
          APP_URL=http://127.0.0.1:8787
          SERVER_URL=http://127.0.0.1:8787
          ENV
          docker compose up --build --wait --wait-timeout 120
      - name: Verify account and data survive a restart
        run: |
          base=http://127.0.0.1:8787
          jar=$(mktemp)
          curl -fsS "$base/api/desktop" | jq -e '.application == "tidebot" and .web and .apiVersion == 1'
          curl -fsS -c "$jar" -H 'Content-Type: application/json' "$base/api/auth/password" \
            --data '{"email":"compose-fixture@example.test","password":"compose-only-test-password"}' > /dev/null
          bot=$(curl -fsS -b "$jar" "$base/api/bots" | jq -er '.bots[0].id')
          docker compose restart
          docker compose up --wait --wait-timeout 120
          curl -fsS -b "$jar" "$base/api/bots" | jq -e --arg bot "$bot" '.bots[0].id == $bot'
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs tidebot
      - name: Stop the fixture
        if: always()
        run: docker compose down
