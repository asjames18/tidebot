name: Desktop package verification

on:
  push:
    branches: ['codex/platform-qa*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, runner: windows-2022, flag: --win, arch: x64 }
          - { name: Linux x64, runner: ubuntu-24.04, flag: --linux, arch: x64 }
          - { name: macOS Intel, runner: macos-15-intel, flag: --mac, arch: x64 }
          - { name: macOS Apple Silicon, runner: macos-15, flag: --mac, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - run: npm run stage
        working-directory: desktop
        env:
          TARGET_ARCH: ${{ matrix.arch }}
      - run: node scripts/eb-cli.mjs ${{ matrix.flag }} --${{ matrix.arch }} --dir --publish never -c.directories.output=dist/qa
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: node desktop/scripts/smoke-packaged.mjs desktop/dist/qa
