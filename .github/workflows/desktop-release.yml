name: Desktop Release (Windows, macOS, Linux)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x64)
            os: ubuntu-latest
            platform: linux
            args: --linux
            target_arch: ""
          - name: Windows (x64)
            os: windows-2022
            platform: win
            args: --win
            target_arch: ""
          - name: macOS (arm64)
            os: macos-15
            platform: mac
            args: --mac --arm64
            target_arch: arm64
          - name: macOS (x64)
            os: macos-15-intel
            platform: mac
            args: --mac --x64
            target_arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install root dependencies and build web + server
        run: |
          npm ci
          npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Set release version (dev prerelease on main, stable on v* tag)
        id: ver
        shell: bash
        run: |
          BASE_VER=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
            RELEASE_TYPE="release"
          else
            VER="${BASE_VER}-dev.${GITHUB_RUN_NUMBER}"
            RELEASE_TYPE="prerelease"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "release_type=${RELEASE_TYPE}" >> "$GITHUB_OUTPUT"
          node -e "
            const fs = require('node:fs');
            const p = './desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = '${VER}';
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Building TideBot Desktop v${VER} (${RELEASE_TYPE})"

      - name: Stage server, web, and native addons for Electron
        working-directory: desktop
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: npm run stage

      - name: Package and publish to GitHub Releases
        if: matrix.platform != 'mac'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          node scripts/eb-cli.mjs ${{ matrix.args }}
          --publish always
          --release-type ${{ steps.ver.outputs.release_type }}

      - name: Package macOS installer
        if: matrix.platform == 'mac'
        working-directory: desktop
        run: node scripts/eb-cli.mjs ${{ matrix.args }} --publish never

      - name: Save macOS release assets
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.target_arch }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 1

  publish-mac:
    name: Publish both macOS installers and updater manifest
    needs: build
    # A failed Windows/Linux leg must not block the macOS publish: run
    # even when `build` failed, then refuse loudly if either macOS
    # artifact set is missing instead of publishing a partial manifest.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-*
          path: mac-release
      - name: Verify both macOS builds produced installers
        run: |
          for arch in x64 arm64; do
            dir="mac-release/mac-$arch"
            test -d "$dir" || { echo "::error::Missing $dir — a macOS build leg failed; refusing to publish a partial manifest."; exit 1; }
            ls "$dir"/*.dmg "$dir"/*.zip >/dev/null || { echo "::error::No installer files in $dir — refusing to publish a partial manifest."; exit 1; }
          done
      - name: Publish macOS assets as a single update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # `needs.build.outputs.version` is empty if the build job failed
          # before publishing outputs; re-derive it the same way the
          # build job does so the macOS publish can still proceed.
          if [ -z "$VERSION" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              VERSION="${GITHUB_REF#refs/tags/v}"
            else
              VERSION="$(node -p "require('./package.json').version")-dev.${GITHUB_RUN_NUMBER}"
            fi
          fi
          tag="v$VERSION"
          published_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          test "$published_sha" = "$GITHUB_SHA"
          intel=mac-release/mac-x64
          apple=mac-release/mac-arm64
          node desktop/scripts/mac-update-manifest.mjs "$VERSION" "$intel" "$apple" mac-release/latest-mac.yml
          gh release upload "$tag" "$intel"/* "$apple"/* --clobber
          gh release upload "$tag" mac-release/latest-mac.yml --clobber
