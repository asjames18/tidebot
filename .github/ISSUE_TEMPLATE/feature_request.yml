name: 💡 Feature request
description: Suggest an idea or improvement for TideBot
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Concrete behavior beats abstract ideas.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or approaches you evaluated.
  - type: checkboxes
    id: alignment
    attributes:
      label: Project direction
      description: TideBot favors self-hosting, bring-your-own models and broad integrations over closed features. Anything that keeps it self-hostable and provider-neutral fits best.
      options:
        - label: This fits TideBot's direction (self-hosted, BYOM, open source)
          required: true
        - label: I'm willing to help implement or test this
