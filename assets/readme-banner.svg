<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>
    <radialGradient id="glow1" cx="22%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#05070B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.24"/>
      <stop offset="60%" stop-color="#0EA5E9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#05070B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#glow1)"/>
  <rect width="1200" height="340" rx="20" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="338" rx="19" fill="none" stroke="#334155" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Subtle architectural grid -->
  <g stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="85" x2="1200" y2="85"/>
    <line x1="0" y1="170" x2="1200" y2="170"/>
    <line x1="0" y1="255" x2="1200" y2="255"/>
    <line x1="240" y1="0" x2="240" y2="340"/>
    <line x1="480" y1="0" x2="480" y2="340"/>
    <line x1="720" y1="0" x2="720" y2="340"/>
    <line x1="960" y1="0" x2="960" y2="340"/>
  </g>

  <!-- Holographic Geometric Core Icon -->
  <g transform="translate(88, 108)">
    <rect x="0" y="0" width="96" height="96" rx="24" fill="url(#cardGrad)" stroke="url(#accent)" stroke-width="1.5"/>
    <polygon points="48,18 76,34 76,62 48,78 20,62 20,34" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.85"/>
    <polygon points="48,28 66,39 66,57 48,68 30,57 30,39" fill="#38BDF8" fill-opacity="0.18" stroke="#818CF8" stroke-width="1.5"/>
    <circle cx="48" cy="48" r="7" fill="#F8FAFC"/>
  </g>

  <!-- Title & Tagline -->
  <g transform="translate(212, 126)">
    <rect x="0" y="-28" width="236" height="24" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1"/>
    <text x="14" y="-12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="1.2">OPEN SOURCE · BYOM AGENT OS</text>

    <text x="0" y="34" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="52" font-weight="800" fill="#F8FAFC" letter-spacing="-1.2">TideOS</text>
    <text x="195" y="34" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="500" fill="#94A3B8" letter-spacing="-0.4">Autonomous Agent Studio</text>

    <text x="0" y="72" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="17" fill="#CBD5E1">
      Self-hosted multi-agent workspace with OpenRouter BYOM, 1,500+ Composio app tools,
    </text>
    <text x="0" y="96" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="17" fill="#CBD5E1">
      isolated Linux cloud desktops, local workspace sandboxes, and real-time WebGL shaders.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 118)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#E2E8F0">
      <rect x="0" y="0" width="158" height="28" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="14" y="18">250+ OpenRouter LLMs</text>

      <rect x="170" y="0" width="166" height="28" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="184" y="18">1,500+ Composio Apps</text>

      <rect x="348" y="0" width="154" height="28" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="362" y="18">Orgo Cloud Desktops</text>

      <rect x="514" y="0" width="156" height="28" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="528" y="18">GLSL Shader Engine</text>
    </g>
  </g>
</svg>
