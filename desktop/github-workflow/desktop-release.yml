name: Desktop Release (Windows, macOS, Linux)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x64)
            os: ubuntu-latest
            platform: linux
            args: --linux
          - name: Windows (x64)
            os: windows-latest
            platform: win
            args: --win
          - name: macOS (arm64 + x64)
            os: macos-latest
            platform: mac
            args: --mac

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install root dependencies and build web + server
        run: |
          npm ci
          npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Set release version (dev prerelease on main, stable on v* tag)
        id: ver
        shell: bash
        run: |
          BASE_VER=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
            RELEASE_TYPE="release"
          else
            VER="${BASE_VER}-dev.${GITHUB_RUN_NUMBER}"
            RELEASE_TYPE="prerelease"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "release_type=${RELEASE_TYPE}" >> "$GITHUB_OUTPUT"
          node -e "
            const fs = require('node:fs');
            const p = './desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = '${VER}';
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Building TideBot Desktop v${VER} (${RELEASE_TYPE})"

      - name: Stage server, web, and native addons for Electron
        working-directory: desktop
        run: npm run stage

      - name: Package and publish to GitHub Releases
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx electron-builder ${{ matrix.args }}
          --publish always
          -c.publish.releaseType=${{ steps.ver.outputs.release_type }}
